format_version = 5
id = "crash.boot_level_pack"
version = "1.0.0"
name = "Crash Bandicoot Boot in Level"
author = "Nyper"
description = "Arranca el juego directamente en el nivel elegido por ID, escribiendo el byte de nivel (0x80011DB0) durante el estado de boot (código GameShark D0011DB2 3404)."
license = "MIT"
resolver = "declarative"

[[target]]
game_id = "SCUS-94900" # Pon aquí el ID de tu ISO de Crash (ej. SCUS-94154 / SLES-00039)

[[feature]]
id = "boot-level"
name = "Boot in Level"
description = "Elige el nivel de arranque. Es un código de boot: se activa al arrancar el juego, no a mitad de partida."
default_enabled = false

[[option]]
feature = "boot-level"
id = "level"
label = "Nivel"
description = "Nivel en el que arrancar el juego (byte de nivel 0x80011DB0)."
type = "choice"
default = "0x22"

